name: Publish Wordspace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website package
        uses: actions/checkout@v4
      - name: Download and verify website release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/fangchao-b/fangchao-b.github.io/releases/download/site-v1/site.tar.gz" --output "$RUNNER_TEMP/site.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/fangchao-b/fangchao-b.github.io/releases/download/site-v1/site.tar.gz.sha256" --output "$RUNNER_TEMP/site.tar.gz.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check site.tar.gz.sha256)
          mkdir -p _site
          tar -xzf "$RUNNER_TEMP/site.tar.gz" -C _site
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_site')
          manifest = json.loads((root / 'site-manifest.json').read_text())
          for name, digest in manifest['files'].items():
              path = root / name
              assert path.is_file(), f'Missing file: {name}'
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, f'Corrupted file: {name}'
          print(f"Verified {len(manifest['files'])} website files")
          (root / 'site-manifest.json').unlink()
          (root / '.nojekyll').touch()
          PY
      - name: Set bookmark hold to two seconds
        shell: bash
        run: |
          python3 - <<'PY'
          """Apply the two-second bookmark setting to the verified site-v1 release."""
          from pathlib import Path
          import hashlib
          import sys
          root = Path('_site')
          pages = ['index.html', 'ielts/index.html', 'study/index.html', 'ielts/study/index.html']
          documents = {name: (root / name).read_text() for name in pages}
          def replace_once(text, old, new):
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new, 1)
          for name in ['study/index.html', 'ielts/study/index.html']:
              text = documents[name]
              for old, new in [
                  ('},3000);', '},2000);'),
                  ('}, 3000);', '}, 2000);'),
                  ('bookmark-hold 3s linear both', 'bookmark-hold 2s linear both'),
                  ('长按单词 3 秒，再点书签标记', '长按单词 2 秒，再点书签标记'),
              ]:
                  text = replace_once(text, old, new)
              documents[name] = text
          for name in ['index.html', 'ielts/index.html']:
              documents[name] = replace_once(documents[name], '长按词卡 3 秒', '长按词卡 2 秒')
          revisions = {
              'd8de44afad71': hashlib.sha256(documents['study/index.html'].encode()).hexdigest()[:12],
              '500defbe118c': hashlib.sha256(documents['ielts/study/index.html'].encode()).hexdigest()[:12],
          }
          cache = 'wordspace-' + hashlib.sha256(''.join(documents.values()).encode()).hexdigest()[:12]
          documents['sw.js'] = (root / 'sw.js').read_text()
          for name in ['index.html', 'ielts/index.html', 'sw.js']:
              text = documents[name]
              assert 'wordspace-805d8b6e643a' in text
              text = text.replace('wordspace-805d8b6e643a', cache)
              for old, new in revisions.items():
                  text = text.replace(old, new)
              documents[name] = text
          for name, text in documents.items():
              (root / name).write_text(text)
          print(f'Updated bookmark delay, progress animation and help to 2 seconds; cache: {cache}')
          PY
      - name: Apply excerpt notebook update
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/fangchao-b/fangchao-b.github.io/releases/download/site-v1/excerpts-update.tar.gz" --output "$RUNNER_TEMP/excerpts-update.tar.gz"
          echo "a9d6896fd4922a1d15fa9d0c0172a20c54816544c417e3d03b2899cc70107595  $RUNNER_TEMP/excerpts-update.tar.gz" | sha256sum --check
          tar -tzf "$RUNNER_TEMP/excerpts-update.tar.gz" | while IFS= read -r name; do
            case "$name" in
              ._*|*/._*) ;;
              index.html|ielts/index.html|study/index.html|ielts/study/index.html|sw.js|study/manifest.json|ielts/study/manifest.json) ;;
              *) echo "Unexpected update file: $name" >&2; exit 1 ;;
            esac
          done
          tar --exclude='._*' --exclude='*/._*' -xzf "$RUNNER_TEMP/excerpts-update.tar.gz" -C _site
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
